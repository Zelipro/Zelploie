[project]
name = "zelploie"
version = "0.1.0"
description = "Suivi strict de l'emploi du temps hebdomadaire de Zeli (UTBM) — notifications + écran de blocage OK."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Zeli" }
]
dependencies = [
    # Le cahier des charges recommandait flet>=0.80.5 ; en pratique
    # flet-android-notifications>=0.9 exige flet>=0.82.0, donc c'est le
    # vrai plancher. Développé et testé ici avec flet==0.86.5.
    "flet>=0.82.0",
    "flet-android-notifications>=0.10.1",
    "supabase>=2.9.0",
    # Notifications OS desktop (toast Windows / libnotify Linux).
    "plyer>=2.1.0",
    # Icône de barre système desktop (Windows/Linux) — Flet n'a pas de
    # contrôle "tray icon" intégré.
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.zeli"
product = "Zelploie"
company = "Zeli"
copyright = "Copyright (C) 2026 Zeli"
desktop_flavor = "light"

[tool.flet.app]
path = "src"

# Permissions Android obligatoires (spec §7.1/§7.2) — voir README.md
# "Build Android" pour les étapes manuelles complémentaires (patch du
# manifeste + activation de la notification plein écran Android 14+).
[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.USE_FULL_SCREEN_INTENT" = true
"android.permission.INTERNET" = true
